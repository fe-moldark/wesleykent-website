name: Jekyll Site CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3.2' # Specify your Ruby version
        bundler-cache: true

    - name: Update Bundler
      run: gem install bundler:2.3.13

    - name: Install Dependencies
      run: bundle install

    - name: Build the site
      run: bundle exec jekyll build
